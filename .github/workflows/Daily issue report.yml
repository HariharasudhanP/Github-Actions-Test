name: Daily Issues Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      publish_issue:
        description: Publish the generated report as a GitHub issue
        required: false
        default: true
        type: boolean
      hours_back:
        description: Number of hours to include for recent activity
        required: false
        default: '24'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  issues-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate issues activity report
        id: report
        uses: actions/github-script@v7
        env:
          HOURS_BACK: ${{ github.event_name == 'workflow_dispatch' && inputs.hours_back || '24' }}
        with:
          script: |
            const fs = require('fs');

            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;
            const now = new Date();
            const hoursBack = Math.max(parseInt(process.env.HOURS_BACK || '24', 10) || 24, 1);
            const sinceDate = new Date(now.getTime() - hoursBack * 60 * 60 * 1000);
            const staleDate = new Date(now.getTime() - 14 * 24 * 60 * 60 * 1000);

            const openIssuesRaw = await github.paginate(github.rest.issues.listForRepo, {
              owner: repoOwner,
              repo: repoName,
              state: 'open',
              per_page: 100
            });
            const openIssues = openIssuesRaw.filter((item) => !item.pull_request);

            const recentlyUpdatedRaw = await github.paginate(github.rest.issues.listForRepo, {
              owner: repoOwner,
              repo: repoName,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              since: sinceDate.toISOString(),
              per_page: 100
            });
            const recentlyUpdatedIssues = recentlyUpdatedRaw
              .filter((item) => !item.pull_request)
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

            const recentComments = await github.paginate(github.rest.issues.listCommentsForRepo, {
              owner: repoOwner,
              repo: repoName,
              since: sinceDate.toISOString(),
              sort: 'created',
              direction: 'desc',
              per_page: 100
            });

            const labelCounts = new Map();
            let unassignedCount = 0;
            let staleOpenCount = 0;

            for (const issue of openIssues) {
              if (!issue.assignee) {
                unassignedCount += 1;
              }

              if (new Date(issue.updated_at) < staleDate) {
                staleOpenCount += 1;
              }

              if (!issue.labels || issue.labels.length === 0) {
                labelCounts.set('no-label', (labelCounts.get('no-label') || 0) + 1);
              } else {
                for (const label of issue.labels) {
                  const labelName = typeof label === 'string' ? label : label.name;
                  if (labelName) {
                    labelCounts.set(labelName, (labelCounts.get(labelName) || 0) + 1);
                  }
                }
              }
            }

            const topLabels = [...labelCounts.entries()]
              .sort((a, b) => b[1] - a[1])
              .slice(0, 8);

            const oldestOpenIssues = [...openIssues]
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
              .slice(0, 12);

            const recentIssueUpdates = recentlyUpdatedIssues.slice(0, 20);
            const recentIssueComments = recentComments.slice(0, 20);

            const tick = '`';

            const formatIssue = (issue) => {
              const assignees = issue.assignees && issue.assignees.length > 0
                ? issue.assignees.map((a) => '@' + a.login).join(', ')
                : 'unassigned';
              return '- [#' + issue.number + '](' + issue.html_url + ') ' + issue.title +
                ' (assignees: ' + assignees + ', updated: ' + issue.updated_at + ')';
            };

            const formatComment = (comment) => {
              const body = (comment.body || '').replace(/\s+/g, ' ').trim();
              const snippet = body.length > 140 ? body.slice(0, 137) + '...' : body;
              const issueNum = comment.issue_url.split('/').pop();
              return '- [Issue #' + issueNum + ' comment](' + comment.html_url + ')' +
                ' by @' + comment.user.login + ' at ' + comment.created_at + ': ' +
                (snippet || '[no text]');
            };

            const lines = [];
            lines.push('# 📊 Daily Issues Report for **' + repoOwner + '/' + repoName + '**');
            lines.push('');
            lines.push('🕒 **Generated at:** ' + now.toISOString() + ' (UTC)');
            lines.push('🗓️ **Activity window:** last **' + hoursBack + ' hours** (since ' + sinceDate.toISOString() + ')');
            lines.push('');
            lines.push('---');
            lines.push('');
            lines.push('## 🐞 Open Issues Snapshot');
            lines.push('');
            lines.push('| 📝 Stat | 🔢 Count |');
            lines.push('|---|---:|');
            lines.push('| Total open issues | **' + openIssues.length + '** |');
            lines.push('| Unassigned open issues | **' + unassignedCount + '** |');
            lines.push('| Stale open issues (14+ days) | **' + staleOpenCount + '** |');
            lines.push('');

            lines.push('## 🏷️ Top Labels on Open Issues');
            if (topLabels.length === 0) {
              lines.push('> _No labels found on open issues_');
            } else {
              lines.push('| Label | Count |');
              lines.push('|---|---:|');
              for (const [label, count] of topLabels) {
                lines.push('| ' + tick + label + tick + ' | ' + count + ' |');
              }
            }
            lines.push('');

            lines.push('<details><summary>🔎 <strong>Oldest Open Issues</strong></summary>');
            lines.push('');
            if (oldestOpenIssues.length === 0) {
              lines.push('_No open issues_');
            } else {
              lines.push('| Issue | Title | Assignees | Created | Last Updated |');
              lines.push('|---|---|---|---|---|');
              for (const issue of oldestOpenIssues) {
                const assignees = issue.assignees && issue.assignees.length > 0
                  ? issue.assignees.map((a) => '@' + a.login).join(', ')
                  : 'unassigned';
                const safeTitle = issue.title.replace(/\|/g, ' ');
                lines.push('| [#' + issue.number + '](' + issue.html_url + ') | ' + safeTitle +
                  ' | ' + assignees + ' | ' + issue.created_at.slice(0, 10) +
                  ' | ' + issue.updated_at.slice(0, 10) + ' |');
              }
            }
            lines.push('</details>');
            lines.push('');

            lines.push('## 🕵️ Recent Issue Activity (last ' + hoursBack + 'h)');
            lines.push('');
            lines.push('<details><summary>📝 <strong>Recently Updated Issues</strong></summary>');
            lines.push('');
            if (recentIssueUpdates.length === 0) {
              lines.push('_No issue updates in this window_');
            } else {
              for (const issue of recentIssueUpdates) {
                lines.push(formatIssue(issue));
              }
            }
            lines.push('</details>');
            lines.push('');

            lines.push('<details><summary>💬 <strong>Recent Issue Comments</strong></summary>');
            lines.push('');
            if (recentIssueComments.length === 0) {
              lines.push('_No issue comments in this window_');
            } else {
              for (const comment of recentIssueComments) {
                lines.push(formatComment(comment));
              }
            }
            lines.push('</details>');
            lines.push('');
            lines.push('---');
            lines.push('> _This report was generated automatically by the **Daily Issues Report** workflow._');

            const reportBody = lines.join('\n');
            const reportPath = process.env.RUNNER_TEMP + '/daily-issues-report.md';
            fs.writeFileSync(reportPath, reportBody, 'utf8');

            core.setOutput('report_path', reportPath);
            core.setOutput('report_date', now.toISOString().slice(0, 10));
            core.setOutput('report_body', reportBody.slice(0, 60000));

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-issues-report-${{ steps.report.outputs.report_date }}
          path: ${{ steps.report.outputs.report_path }}
          retention-days: 30

      - name: Publish report to run summary
        run: cat "${{ steps.report.outputs.report_path }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create daily report issue
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_issue }}
        uses: actions/github-script@v7
        env:
          REPORT_DATE: ${{ steps.report.outputs.report_date }}
          REPORT_BODY: ${{ steps.report.outputs.report_body }}
        with:
          script: |
            const title = 'Daily Issues Report - ' + process.env.REPORT_DATE;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: process.env.REPORT_BODY
            });
